# Päivittäinen dokumenttien muutosvahti (7A.2). Ei kielimallia. Cron UTC.

name: dokumenttivahti

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  dokumentit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tarkista lähdedokumenttien tiivisteet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/tarkistukset/dokumentit.ts
