# Fingrid-liityntäpisteet kartalle — OSM Overpass (viikoittain).

name: fingrid-liityntapisteet

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  liityntapisteet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Päivitä sähköasemien sijainnit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/lahteet/fingrid-liityntapisteet.ts
