# Fingrid tuotantosarjat (7A.5.4). Cron: tasatunnein.
# GitHub voi käynnistää ajon muutaman minuutin yli tasatunnin.

name: fingridhaku

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fingrid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hae Fingrid-tuotanto
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINGRID_API_AVAIN: ${{ secrets.FINGRID_API_AVAIN }}
        run: npx tsx agents/lahteet/fingrid.ts
