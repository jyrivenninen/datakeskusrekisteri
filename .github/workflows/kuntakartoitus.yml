# Kuntalähteiden automaattikartoitus (7A.6). Kuukausittain.

name: kuntakartoitus

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  kartoitus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Kartoita RSS ja avoindata.fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KUNTA_KARTOITUS_KIRJOITA: "1"
        run: npx tsx scripts/kartoita-kuntalahteet.ts
