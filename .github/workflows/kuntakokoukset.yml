# Viikoittainen kuntien esityslista-RSS (7A.6 vaihe 1). Ei kielimallia.

name: kuntakokoukset

on:
  schedule:
    - cron: "30 5 * * 2"
  workflow_dispatch:

jobs:
  esityslistat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hae kuntien RSS/iCal-syötteet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/lahteet/kunnat/esityslistat.ts
