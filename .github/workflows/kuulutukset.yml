# Syken kuulutussivujen seuranta (7A.5.6). Viikoittain.

name: kuulutukset

on:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

jobs:
  kuulutukset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seuraa kuulutussivuja
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/lahteet/kuulutukset.ts
