# Päivittäinen linkkitarkistus (7A.1). Ei kielimallia. Cron UTC.

name: linkkitarkistus

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  linkit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tarkista lähdeosoitteet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/tarkistukset/linkit.ts
