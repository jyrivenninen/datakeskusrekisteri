# Kuntien väkiluvut PxWebistä (7A.5.7). Viikoittain.

name: pxwebhaku

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  pxweb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hae kuntien väkiluvut
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/lahteet/pxweb.ts
