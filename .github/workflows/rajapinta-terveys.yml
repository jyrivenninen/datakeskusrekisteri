# Rajapintojen terveysvalvonta (7A.5). Päivittäin.

name: rajapinta-terveys

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  terveys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tarkista rajapinnat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINGRID_API_AVAIN: ${{ secrets.FINGRID_API_AVAIN }}
          SYKE_RAJAPINTA_TUNNISTE: ${{ secrets.SYKE_RAJAPINTA_TUNNISTE }}
        run: npx tsx agents/tarkistukset/rajapinta-terveys.ts
