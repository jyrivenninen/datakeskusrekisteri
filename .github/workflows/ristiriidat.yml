# Päivittäinen ristiriitatarkistus (7A.3). Ei kielimallia. Cron UTC.

name: ristiriidat

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

jobs:
  ristiriidat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Aja ristiriitasäännöt
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/tarkistukset/ristiriidat.ts
