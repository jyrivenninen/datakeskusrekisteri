# Päivittäinen Ryhti-kaavahaku (7A.5.1). Ei kielimallia. Cron UTC.

name: ryhtihaku

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

jobs:
  ryhti:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hae Ryhti-kaavakohteet
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYKE_RAJAPINTA_TUNNISTE: ${{ secrets.SYKE_RAJAPINTA_TUNNISTE }}
        run: npx tsx agents/lahteet/ryhti.ts
