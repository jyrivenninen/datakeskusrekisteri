# Viikoittainen vanhentumisvahti (7A.4). Ei kielimallia. Cron UTC.

name: vanhentuneet

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vanhentuneet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Aja vanhentumisvahti
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/tarkistukset/vanhentuneet.ts
