# Päivittäinen YTJ-haku (7A.5.2). Ei kielimallia. Cron UTC.

name: ytjhaku

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

jobs:
  ytj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hae YTJ-perustiedot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx agents/lahteet/ytj.ts
